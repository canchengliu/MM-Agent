[project]
name = "mm-agent-backend"
version = "0.1.0"
description = "O-Award workflow engine backend built with FastAPI."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.0.0",
    "redis>=5.0.0",
    "arq>=0.26.0",
    "loguru>=0.7.0",
    "cryptography>=42.0.0",
    "python-jose>=3.3.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
